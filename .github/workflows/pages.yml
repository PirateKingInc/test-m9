name: Deploy to GitHub Pages

# On every merge to main: run the tests, deploy the static site as a Pages
# artifact, then poll the live URL until it returns 200 serving this commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Never deploy red
        run: npm test
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          cp sheet.html _site/
          echo "$GITHUB_SHA" > _site/version.txt
          touch _site/.nojekyll
      - name: No credential in the site (Phase 12b)
        run: node tools/check-bundle.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Poll live URL until it returns 200 with this commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL")
            live=$(curl -s "${SITE_URL}version.txt?nocache=$i" || true)
            echo "attempt $i: $SITE_URL -> $code, live version ${live:-none}"
            if [ "$code" = "200" ] && [ "$live" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "Site never served $GITHUB_SHA with HTTP 200" >&2
          exit 1
      - name: No credential in the live site, inspected file by file (Phase 12b)
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/check-bundle.mjs _site "$SITE_URL"
