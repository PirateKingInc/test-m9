name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, economy, counter, pathfinding and bot tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser e2e tests
        run: npm run test:e2e

  mobile-playthrough:
    # Phase 4 verification (f): a whole match against the AI played with touch
    # events only, in mobile emulation. Runs in parallel with the other jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 35 # the Phase 7 free-for-all runs longer (16.5 min seen)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Touch-only full match
        run: npm run test:mobile

  fairness:
    # Phase 2 fairness proof: scripted player policies vs every difficulty tier
    # (12 fixed seeds each, deterministic). Runs in parallel with the test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bot-vs-difficulty win rates
        run: npm run test:fairness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fairness-results
          path: test-results/fairness.json

  multiplayer:
    # Phase 10: the security rules and the multiplayer lobby/connection tests,
    # against the Firebase Local Emulator Suite: never the production project,
    # no credentials. The database emulator needs Java.
    runs-on: ubuntu-latest
    timeout-minutes: 50 # Phase 11: whole matches in 2-4 real browsers, one at a time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Security rules (emulator)
        run: npm run test:rules
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Lobby, connections, and whole matches in several browsers (emulator)
        run: npm run test:mp
